<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>加入團隊 - BeARocketEngineer</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeARocketEngineer">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  
  <style>
    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body {
      animation: pageFadeIn 0.35s ease forwards;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-900 flex items-center justify-center p-4">

  <div class="relative w-full max-w-lg bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-200 max-h-[92vh] overflow-y-auto">
    <div class="flex items-center justify-between gap-2 mb-2">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">
        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
        STUDENT ROCKET PROJECT
      </span>
      <span class="text-[11px] font-mono-num text-slate-400 font-semibold">ONBOARDING</span>
    </div>

    <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight leading-tight">
      BeA<span class="text-blue-600">RocketEngineer</span>
    </h1>
    <p class="text-xs md:text-sm text-slate-600 mt-2 leading-relaxed">
      歡迎加入學生火箭研發團隊！作為新進成員，你將走訪辦公室、測試廠房與加工車間，協助推進、航電、結構各小組排除疑難雜症，一步步推進火箭研發進度！
    </p>

    <div class="mt-5 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5">隊員代號 / 姓名</label>
        <input type="text" id="input-player-name" value="阿剛" maxlength="10" placeholder="請輸入你的代號"
          class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
      </div>

      <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-600 space-y-1.5">
        <div class="font-bold text-slate-800 flex items-center gap-1.5">
          <span>📋</span> 新人研發任務須知
        </div>
        <p>• 不分組別：推進、航電、結構與指揮組都有工作需要你協助。</p>
        <p>• 專案啟動：研發時程自 <strong>2022 / 07 / 01</strong> 起算推進。</p>
      </div>
    </div>

    <div class="mt-6 pt-3 border-t border-slate-100 flex flex-col gap-2">
      <button id="btn-start-game"
        class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-extrabold text-sm tracking-wide shadow-lg shadow-blue-500/25 transition">
        報到並進入辦公室 →
      </button>
      <div class="text-[10px] text-slate-400 text-center">
        電腦：WASD 移動・靠近按 [E] / 手機：左下搖桿移動・右下互動按鈕
      </div>
    </div>
  </div>

  <script type="module">
    import { LabAudio } from './js/audio.js';
    const sfx = new LabAudio();
    const STORAGE_KEY = 'BE_A_ROCKET_ENGINEER_SAVE_V1';

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.playerName) document.getElementById('input-player-name').value = parsed.playerName;
      }
    } catch(e) {}

    document.getElementById('btn-start-game').onclick = () => {
      const input = document.getElementById('input-player-name');
      const name = (input && input.value.trim()) ? input.value.trim() : '阿剛';

      let currentSave = {};
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) currentSave = JSON.parse(raw);
      } catch(e) {}

      const newSave = {
        hasStarted: true,
        playerName: name,
        playerRole: 'ALL_ROUND',
        playerTitle: '新進研發隊員',
        budget: currentSave.budget ?? 2000,
        morale: currentSave.morale ?? 100,
        readiness: currentSave.readiness ?? 0,
        gameElapsedSeconds: currentSave.gameElapsedSeconds ?? 0, // 從 2022/7/1 開始累計
        solvedEventsList: currentSave.solvedEventsList ?? []
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(newSave));
      sfx.playSelect();

      document.body.style.transition = 'opacity 0.35s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    };
  </script>
</body>
</html>
