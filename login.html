<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>登入 - BeARocketEngineer</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeARocketEngineer">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  
  <style>
    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body {
      animation: pageFadeIn 0.35s ease forwards;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-900 flex items-center justify-center p-4">

  <div class="relative w-full max-w-lg bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-200 max-h-[92vh] overflow-y-auto">
    <div class="flex items-center justify-between gap-2 mb-2">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">
        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
        STUDENT ROCKET PROJECT
      </span>
      <span class="text-[11px] font-mono-num text-slate-400 font-semibold">LOGIN</span>
    </div>

    <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight leading-tight">
      BeA<span class="text-blue-600">RocketEngineer</span>
    </h1>
    <p class="text-xs md:text-sm text-slate-600 mt-1.5 leading-relaxed">
      距離試車發射倒數剩下 18 小時！在辦公室中穿梭協調各組、巡視測試廠房與加工車間，頂住壓力讓火箭順利離架！
    </p>

    <div class="mt-4 space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">你的代號</label>
        <input type="text" id="input-player-name" value="阿剛" maxlength="10"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">擔當職位</label>
        <div class="grid grid-cols-3 gap-2" id="role-selector">
          <button type="button" data-role="SE" data-title="系統整合 Lead"
            class="role-btn active py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-blue-50 border-blue-500 text-blue-900">
            <span>🧭 整合</span>
            <span class="text-[9px] text-blue-700">協調救火</span>
          </button>
          <button type="button" data-role="PROP" data-title="推進工程 Propulsion"
            class="role-btn py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-white border-slate-200 text-slate-600 hover:border-slate-300">
            <span>🔥 推進</span>
            <span class="text-[9px] text-slate-400">燃燒室</span>
          </button>
          <button type="button" data-role="AV" data-title="航電飛控 Avionics"
            class="role-btn py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-white border-slate-200 text-slate-600 hover:border-slate-300">
            <span>⚡ 航電</span>
            <span class="text-[9px] text-slate-400">姿態飛控</span>
          </button>
        </div>
      </div>
    </div>

    <div class="mt-6 pt-3 border-t border-slate-100 flex flex-col gap-2">
      <button id="btn-start-game"
        class="w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-extrabold text-sm tracking-wide shadow-lg shadow-blue-500/25 transition">
        進入辦公室 →
      </button>
      <div class="text-[10px] text-slate-400 text-center">
        電腦：WASD 移動・靠近按 [E] / 手機：左下搖桿移動・右下互動按鈕
      </div>
    </div>
  </div>

  <script type="module">
    import { LabAudio } from './js/audio.js';
    const sfx = new LabAudio();
    const STORAGE_KEY = 'BE_A_ROCKET_ENGINEER_SAVE_V1';

    let selectedRole = 'SE';
    let selectedTitle = '系統整合 Lead';

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.playerName) document.getElementById('input-player-name').value = parsed.playerName;
        if (parsed.playerRole) {
          selectedRole = parsed.playerRole;
          selectedTitle = parsed.playerTitle;
        }
      }
    } catch(e) {}

    const roleButtons = document.querySelectorAll('.role-btn');
    roleButtons.forEach(btn => {
      if (btn.dataset.role === selectedRole) {
        btn.className = 'role-btn active py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-blue-50 border-blue-500 text-blue-900';
      } else {
        btn.className = 'role-btn py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-white border-slate-200 text-slate-600 hover:border-slate-300';
      }

      btn.onclick = () => {
        sfx.playClick();
        roleButtons.forEach(b => {
          b.className = 'role-btn py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-white border-slate-200 text-slate-600 hover:border-slate-300';
        });
        btn.className = 'role-btn active py-2.5 px-2 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-0.5 bg-blue-50 border-blue-500 text-blue-900';
        selectedRole = btn.dataset.role;
        selectedTitle = btn.dataset.title;
      };
    });

    document.getElementById('btn-start-game').onclick = () => {
      const input = document.getElementById('input-player-name');
      const name = (input && input.value.trim()) ? input.value.trim() : '阿剛';

      let currentSave = {};
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) currentSave = JSON.parse(raw);
      } catch(e) {}

      const newSave = {
        hasStarted: true,
        playerName: name,
        playerRole: selectedRole,
        playerTitle: selectedTitle,
        budget: currentSave.budget ?? 1450,
        morale: currentSave.morale ?? 96,
        readiness: currentSave.readiness ?? 20,
        countdownSeconds: currentSave.countdownSeconds ?? (18 * 3600 - 20),
        solvedEventsList: currentSave.solvedEventsList ?? []
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(newSave));
      sfx.playSelect();

      document.body.style.transition = 'opacity 0.35s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    };
  </script>
</body>
</html>
