    <!-- ==================== AUDIO SYNTH ==================== -->
    <script>
        class LabAudio {
            constructor() { this.ctx = null; this.enabled = true; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }
            toggle() { this.enabled = !this.enabled; return this.enabled; }
            playTone(freq = 520, type = 'sine', duration = 0.08, volume = 0.1) {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playClick() { this.playTone(850, 'triangle', 0.04, 0.06); }
            playSelect() { this.playTone(960, 'sine', 0.1, 0.08); }
            playSuccess() {
                if (!this.enabled) return; this.init();
                [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.12, 0.08), i * 80));
            }
            playAlarm() {
                if (!this.enabled) return; this.init();
                this.playTone(420, 'sawtooth', 0.18, 0.09);
                setTimeout(() => this.playTone(560, 'sawtooth', 0.22, 0.09), 120);
            }
        }
        const sfx = new LabAudio();
    </script>

        /**
         * 條件評估器：根據當前 gameState 挑選出該區域最合適的事件
         */
        function getEligibleEvent(roomId) {
            const roomData = STORY_EVENTS_DATABASE[roomId];
            if (!roomData) return null;

            const events = [...roomData.events].sort((a, b) => b.priority - a.priority);

            for (const ev of events) {
                const cond = ev.conditions;
                if (!cond) return ev;

                if (cond.requiresNotSolved && cond.requiresNotSolved.some(id => gameState.solvedEvents.has(id))) {
                    continue;
                }
                if (cond.requiresSolved && !cond.requiresSolved.every(id => gameState.solvedEvents.has(id))) {
                    continue;
                }
                if (cond.minReadiness !== undefined && gameState.readiness < cond.minReadiness) {
                    continue;
                }
                if (cond.maxBudget !== undefined && gameState.budget > cond.maxBudget) {
                    continue;
                }
                if (cond.roleSpecific && cond.roleSpecific !== gameState.playerRole) {
                    continue;
                }
                return ev;
            }
            return null;
        }

    <!-- ==================== UI 邏輯與互動事件驅動 ==================== -->
    <script>
        const diagBox = document.getElementById('dialogue-box');
        const diagBadge = document.getElementById('diag-badge');
        const diagSpeaker = document.getElementById('diag-speaker');
        const diagText = document.getElementById('diag-text');
        const diagOptions = document.getElementById('diag-options');
        const diagBtnClose = document.getElementById('diag-btn-close');

        function openRoomDialogue(npc) {
            const ev = getEligibleEvent(npc.roomId);
            if (!ev) return;

            gameState.activeDialogue = { npc, event: ev };
            sfx.playSelect();

            const rData = STORY_EVENTS_DATABASE[npc.roomId];
            diagBadge.className = `px-2.5 py-0.5 rounded-full text-xs font-black ${rData.badgeColor}`;
            diagBadge.innerText = rData.roleTitle;
            diagSpeaker.innerText = ev.speaker;
            diagText.innerText = ev.text;
            diagOptions.innerHTML = '';

            ev.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'p-3 rounded-2xl border text-xs font-bold text-left transition flex flex-col justify-center bg-slate-50 hover:bg-blue-50 border-slate-200 hover:border-blue-400 text-slate-800 shadow-sm';
                btn.innerText = opt.label;
                btn.onclick = () => handleChoiceSelection(npc, ev, opt);
                diagOptions.appendChild(btn);
            });

            diagBox.classList.remove('hidden');
        }

        function handleChoiceSelection(npc, ev, opt) {
            sfx.playTone(740, 'sine', 0.1);
            if (opt.effects) {
                if (opt.effects.budget) gameState.budget += opt.effects.budget;
                if (opt.effects.morale) gameState.morale += opt.effects.morale;
                if (opt.effects.readiness) gameState.readiness += opt.effects.readiness;
            }

            gameState.solvedEvents.add(ev.id);
            if (opt.unlockEvents) {
                opt.unlockEvents.forEach(uId => gameState.solvedEvents.delete(uId));
            }
            updateMetricsUI();

            diagText.innerText = opt.reply;
            diagOptions.innerHTML = `
                <button onclick="closeDialogue()" class="col-span-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs transition">
                    清楚了，前往下個隔間工坊 (關閉)
                </button>
            `;
        }

        function closeDialogue() {
            diagBox.classList.add('hidden');
            gameState.activeDialogue = null;
        }
        diagBtnClose.onclick = closeDialogue;

        // 試車發射檢驗
        document.getElementById('btn-final-launch').onclick = () => {
            const modal = document.getElementById('result-modal');
            const rIcon = document.getElementById('res-icon');
            const rTitle = document.getElementById('res-title');
            const rBadge = document.getElementById('res-badge');
            const rDesc = document.getElementById('res-desc');

            modal.classList.remove('hidden');

            if (gameState.readiness >= 75) {
                sfx.playSuccess();
                rIcon.innerText = '🚀';
                rTitle.innerText = '試車發射大成功！探空二號破雲！';
                rBadge.className = 'inline-block px-3 py-0.5 rounded-full text-[11px] font-mono-num font-bold mt-1 mb-3 bg-emerald-100 text-emerald-800 border border-emerald-300';
                rBadge.innerText = 'MISSION APOGEE: 1,650 METERS';
                rDesc.innerText = `整備度達到 ${gameState.readiness}%！各小間通力合作，固態發動機平穩燃燒、碳纖筒身抵抗住強大剪切力，頂空火藥精準彈射主傘！全組在沙灘上尋回完整黑盒子！`;
            } else {
                sfx.playAlarm();
                rIcon.innerText = '💥';
                rTitle.innerText = '半空中斷！發射中止與殘骸尋回';
                rBadge.className = 'inline-block px-3 py-0.5 rounded-full text-[11px] font-mono-num font-bold mt-1 mb-3 bg-red-100 text-red-800 border border-red-300';
                rBadge.innerText = 'MISSION ABORTED';
                rDesc.innerText = `目前整備度僅 ${gameState.readiness}%。由於部分獨立小間未完成巡檢排查，火箭在穿過低空音障時姿態發散。收拾殘骸回工坊，準備下週向教授提交檢討報告！`;
            }
        };

        document.getElementById('btn-restart').onclick = () => window.location.reload();

        // 鍵盤移動與操控
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') gameState.keys.w = true;
            if (k === 's' || k === 'arrowdown') gameState.keys.s = true;
            if (k === 'a' || k === 'arrowleft') gameState.keys.a = true;
            if (k === 'd' || k === 'arrowright') gameState.keys.d = true;

            if (k === 'e') {
                if (gameState.activeDialogue) closeDialogue();
                else if (gameState.nearbyNPC) openRoomDialogue(gameState.nearbyNPC);
            }
            if (k === 'escape') closeDialogue();
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') gameState.keys.w = false;
            if (k === 's' || k === 'arrowdown') gameState.keys.s = false;
            if (k === 'a' || k === 'arrowleft') gameState.keys.a = false;
            if (k === 'd' || k === 'arrowright') gameState.keys.d = false;
        });

        // 點擊地面導航
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();
        const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#cover-screen') || e.target.closest('header') || e.target.closest('#dialogue-box') || e.target.closest('#result-modal')) {
                return;
            }
            mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);

            const hitPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(floorPlane, hitPoint)) {
                hitPoint.x = Math.max(-14, Math.min(14, hitPoint.x));
                hitPoint.z = Math.max(-11, Math.min(11, hitPoint.z));
                gameState.targetPoint = hitPoint;
                sfx.playClick();

                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = `${e.clientX}px`;
                ripple.style.top = `${e.clientY}px`;
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 450);
            }
        });

        // 角色選擇與起始
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.onclick = () => {
                sfx.playClick();
                document.querySelectorAll('.role-btn').forEach(b => {
                    b.className = 'role-btn py-2.5 px-3 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-1 bg-white border-slate-200 text-slate-600 hover:border-slate-300';
                });
                btn.className = 'role-btn active py-2.5 px-3 rounded-xl border text-xs font-bold text-center transition flex flex-col items-center gap-1 bg-blue-50 border-blue-500 text-blue-900';
                gameState.playerRole = btn.dataset.role;
                gameState.playerTitle = btn.dataset.title;
            };
        });

        document.getElementById('btn-start-game').onclick = () => {
            const name = document.getElementById('input-player-name').value.trim() || '整合 Lead';
            player.userData.tagEl.innerText = `${name} | ${gameState.playerTitle}`;
            sfx.playSelect();

            const cover = document.getElementById('cover-screen');
            cover.style.opacity = '0';
            setTimeout(() => cover.classList.add('hidden'), 500);
        };

        const btnSound = document.getElementById('btn-sound-toggle');
        btnSound.onclick = () => {
            const on = sfx.toggle();
            document.getElementById('sound-icon').innerText = on ? '🔊' : '🔇';
            document.getElementById('sound-text').innerText = on ? '音效' : '靜音';
        };

        setInterval(() => {
            if (gameState.countdownSeconds > 0) {
                gameState.countdownSeconds--;
                const h = String(Math.floor(gameState.countdownSeconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((gameState.countdownSeconds % 3600) / 60)).padStart(2, '0');
                const s = String(gameState.countdownSeconds % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
            }
        }, 1000);

        // 主迴圈
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            let mx = 0; let mz = 0;
            const speed = 7.5 * delta;

            if (gameState.keys.w) { mx -= speed; mz -= speed; }
            if (gameState.keys.s) { mx += speed; mz += speed; }
            if (gameState.keys.a) { mx -= speed; mz += speed; }
            if (gameState.keys.d) { mx += speed; mz += speed; }

            if (gameState.targetPoint) {
                const dx = gameState.targetPoint.x - player.position.x;
                const dz = gameState.targetPoint.z - player.position.z;
                const dist = Math.hypot(dx, dz);
                if (dist > 0.25) {
                    mx = (dx / dist) * speed;
                    mz = (dz / dist) * speed;
                } else {
                    gameState.targetPoint = null;
                }
            }

            if (Math.abs(mx) > 0.0001 || Math.abs(mz) > 0.0001) {
                player.position.x = Math.max(-14, Math.min(14, player.position.x + mx));
                player.position.z = Math.max(-11.5, Math.min(11.5, player.position.z + mz));
                player.rotation.y = Math.atan2(mx, mz);

                player.userData.walkCycle += delta * 15;
                const legAngle = Math.sin(player.userData.walkCycle) * 0.5;
                player.userData.leftLeg.rotation.x = legAngle;
                player.userData.rightLeg.rotation.x = -legAngle;
            } else {
                player.userData.leftLeg.rotation.x = 0;
                player.userData.rightLeg.rotation.x = 0;
            }

            // 檢查是否靠近小房間的 NPC
            let closeOne = null;
            activeNPCs.forEach(npc => {
                const dist = player.position.distanceTo(npc.mesh.position);
                if (dist < 3.0) {
                    closeOne = npc;
                    npc.hintEl.classList.remove('hidden');
                } else {
                    npc.hintEl.classList.add('hidden');
                }
            });
            gameState.nearbyNPC = closeOne;

            updateProjectedBadges();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const asp = window.innerWidth / window.innerHeight;
            camera.left = -d * asp;
            camera.right = d * asp;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = () => animate();
    </script>
</body>
</html>
