<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>辦公室 - BeARocketEngineer</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeARocketEngineer">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  
  <style>
    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body {
      animation: pageFadeIn 0.35s ease forwards;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-100">

  <canvas id="webgl-canvas"></canvas>
  <div id="badge-container" class="absolute inset-0 pointer-events-none z-20"></div>

  <!-- 手機專用虛擬控制器 -->
  <div id="mobile-controls" class="safe-bottom-controls absolute left-4 right-4 pointer-events-none z-30 flex justify-between items-end md:hidden">
    <div id="joystick-zone" class="w-32 h-32 relative pointer-events-auto rounded-full bg-slate-800/20 backdrop-blur-sm border border-white/20 touch-none flex items-center justify-center">
      <div id="joystick-knob" class="w-14 h-14 rounded-full bg-white/90 shadow-lg border border-slate-200 transition-transform duration-75"></div>
    </div>
    <button id="btn-mobile-interact" class="w-16 h-16 rounded-full bg-blue-600 text-white font-black text-sm shadow-xl active:scale-90 transition pointer-events-auto flex items-center justify-center border-2 border-white/50 opacity-40">
      互動
    </button>
  </div>

  <!-- HUD 狀態欄 -->
  <header class="safe-top-bar absolute left-3 right-3 md:left-5 md:right-5 z-30 flex items-center justify-between gap-2 pointer-events-none">
    <div class="glass-panel rounded-2xl px-3 py-2 md:px-5 md:py-3 flex items-center gap-3 md:gap-5 pointer-events-auto border-l-4 border-l-blue-600 shadow-lg">
      <div>
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-[9px] md:text-[10px] font-black uppercase tracking-wider text-slate-400">倒數</span>
        </div>
        <div id="timer-display" class="font-mono-num text-sm md:text-xl font-extrabold text-slate-800">17:59:40</div>
      </div>

      <div class="h-6 md:h-8 w-px bg-slate-200"></div>

      <div class="flex items-center gap-2 md:gap-4 text-xs font-mono-num">
        <div>
          <span class="text-slate-400 block text-[9px] md:text-[10px]">隊費</span>
          <span id="stat-budget" class="font-bold text-emerald-600 text-xs md:text-sm">$1,450</span>
        </div>
        <div>
          <span class="text-slate-400 block text-[9px] md:text-[10px]">肝指數</span>
          <span id="stat-morale" class="font-bold text-amber-600 text-xs md:text-sm">96%</span>
        </div>
        <div>
          <span class="text-slate-400 block text-[9px] md:text-[10px]">整備度</span>
          <span id="stat-readiness" class="font-bold text-blue-600 text-xs md:text-sm">20%</span>
        </div>
      </div>
    </div>

    <div class="glass-panel rounded-2xl px-2.5 py-1.5 md:px-3 md:py-2 flex items-center gap-2 pointer-events-auto text-xs shadow-lg">
      <button id="btn-sound-toggle" class="p-1 md:px-2.5 md:py-1.5 rounded-xl text-slate-600 font-bold transition flex items-center gap-1 text-[11px] md:text-xs">
        <span id="sound-icon">🔊</span>
      </button>
      <div class="h-4 w-px bg-slate-200"></div>
      <button id="btn-final-launch" class="px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-xl bg-slate-900 active:scale-95 text-white font-bold transition shadow-sm text-[11px] md:text-xs">
        🚀 發射
      </button>
    </div>
  </header>

  <!-- 對話抽屜 -->
  <div id="dialogue-box" class="absolute bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-2xl z-40 hidden pointer-events-auto">
    <div class="glass-panel rounded-3xl p-4 md:p-6 shadow-2xl border border-slate-200 max-h-[70vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <span id="diag-badge" class="px-2 py-0.5 rounded-full text-[11px] md:text-xs font-black text-white bg-blue-600">小組</span>
          <span id="diag-speaker" class="font-bold text-xs md:text-sm text-slate-800">名稱</span>
        </div>
        <button id="diag-btn-close" class="text-slate-400 hover:text-slate-600 text-xs px-2.5 py-1 rounded-lg bg-slate-100">關閉</button>
      </div>

      <p id="diag-text" class="text-slate-700 text-xs md:text-sm mt-3 leading-relaxed min-h-[36px]">讀取事件中...</p>
      <div id="diag-options" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3.5"></div>
    </div>
  </div>

  <!-- 結算彈窗 -->
  <div id="result-modal" class="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden p-4">
    <div class="max-w-md w-full bg-white rounded-3xl p-5 md:p-6 shadow-2xl border border-slate-200 text-center">
      <div id="res-icon" class="text-4xl md:text-5xl mb-2">🎉</div>
      <h2 id="res-title" class="text-lg md:text-xl font-black text-slate-900">發射結果</h2>
      <div id="res-badge" class="inline-block px-3 py-0.5 rounded-full text-[11px] font-mono-num font-bold mt-1 mb-2.5 bg-emerald-100 text-emerald-800 border border-emerald-300">STATUS</div>
      <p id="res-desc" class="text-xs text-slate-600 leading-relaxed text-left bg-slate-50 p-3.5 rounded-2xl border border-slate-100 mb-4"></p>
      <button id="btn-restart" class="w-full py-2.5 md:py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm transition">重返辦公室</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
