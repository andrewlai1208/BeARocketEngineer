<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>辦公室 - BeARocketEngineer</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeARocketEngineer">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  
  <style>
    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body {
      animation: pageFadeIn 0.35s ease forwards;
    }
    .os-icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-100 font-sans">

  <!-- 3D WebGL 畫布與 HUD 錨點容器 -->
  <canvas id="webgl-canvas"></canvas>
  <div id="badge-container" class="absolute inset-0 pointer-events-none z-20"></div>

  <!-- 手機專用虛擬控制器 -->
  <div id="mobile-controls" class="safe-bottom-controls absolute left-4 right-4 pointer-events-none z-30 flex justify-between items-end md:hidden">
    <div id="joystick-zone" class="w-32 h-32 relative pointer-events-auto rounded-full bg-slate-800/20 backdrop-blur-sm border border-white/20 touch-none flex items-center justify-center">
      <div id="joystick-knob" class="w-14 h-14 rounded-full bg-white/90 shadow-lg border border-slate-200 transition-transform duration-75"></div>
    </div>
    <button id="btn-mobile-interact" class="w-16 h-16 rounded-full bg-blue-600 text-white font-black text-sm shadow-xl active:scale-90 transition pointer-events-auto flex items-center justify-center border-2 border-white/50 opacity-40">
      互動
    </button>
  </div>

  <!-- HUD 頂部狀態欄 -->
  <header class="safe-top-bar absolute left-3 right-3 md:left-5 md:right-5 z-30 flex items-center justify-between gap-2 pointer-events-none">
    <div class="glass-panel rounded-2xl px-3 py-2 md:px-5 md:py-2.5 flex items-center gap-3 md:gap-5 pointer-events-auto border-l-4 border-l-blue-600 shadow-lg">
      <div>
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-[9px] md:text-[10px] font-black uppercase tracking-wider text-slate-400">專案時程</span>
        </div>
        <div id="timer-display" class="font-mono-num text-xs md:text-sm font-extrabold text-slate-800">2022/07/01 09:00</div>
      </div>

      <div class="h-6 md:h-8 w-px bg-slate-200"></div>

      <div>
        <span class="text-slate-400 block text-[9px] md:text-[10px]">研發總經費</span>
        <span id="stat-budget" class="font-bold text-emerald-600 font-mono-num text-sm md:text-base">$35,000</span>
      </div>

      <div class="h-6 md:h-8 w-px bg-slate-200 hidden sm:block"></div>

      <!-- 次系統研發進度簡報 -->
      <div class="hidden sm:flex items-center gap-2 text-[11px] font-bold font-mono">
        <span id="status-prop" class="px-2 py-0.5 rounded-lg bg-red-50 text-red-700 border border-red-200">🔥 推進: 0/3</span>
        <span id="status-av" class="px-2 py-0.5 rounded-lg bg-blue-50 text-blue-700 border border-blue-200">⚡ 航電: 0/3</span>
        <span id="status-struct" class="px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200">🛡️ 結構: 0/3</span>
        <span id="status-integ" class="px-2 py-0.5 rounded-lg bg-purple-50 text-purple-700 border border-purple-200">🧭 整合: 0/3</span>
      </div>
    </div>

    <div class="glass-panel rounded-2xl px-2.5 py-1.5 md:px-3 md:py-2 flex items-center gap-2 pointer-events-auto text-xs shadow-lg">
      <button id="btn-sound-toggle" class="p-1 md:px-2.5 md:py-1.5 rounded-xl text-slate-600 font-bold transition flex items-center gap-1 text-[11px] md:text-xs">
        <span id="sound-icon">🔊</span>
      </button>
      <div class="h-4 w-px bg-slate-200"></div>
      <button id="btn-final-launch" class="px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-xl bg-slate-900 active:scale-95 text-white font-bold transition shadow-sm text-[11px] md:text-xs">
        🚀 全箭整合試車
      </button>
    </div>
  </header>

  <!-- ==================================================== -->
  <!-- 擬真筆記型電腦 OS 介面（佔據畫面 80%） -->
  <!-- ==================================================== -->
  <div id="os-modal" class="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-3 md:p-6 hidden pointer-events-auto">
    <!-- 80% 電腦主螢幕機身 -->
    <div class="w-[84vw] h-[80vh] bg-slate-900 rounded-3xl border-4 border-slate-700 shadow-2xl flex flex-col overflow-hidden relative select-none">
      
      <!-- 筆電頂部視窗控制列 -->
      <div class="h-9 bg-slate-950/90 border-b border-slate-800 px-4 flex items-center justify-between z-20">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
          <span id="os-laptop-title" class="ml-2 font-mono text-xs font-bold text-slate-300">RocketOS 2022 - 工作站</span>
        </div>
        <button id="btn-close-os" class="px-2.5 py-0.5 rounded-md bg-red-600 hover:bg-red-500 text-white font-bold text-[11px] transition">
          關閉電腦 [ESC]
        </button>
      </div>

      <!-- 電腦桌面工作區 -->
      <div id="os-desktop" class="flex-1 relative bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 overflow-hidden p-4">
        <!-- 火箭工程方格網底紋 -->
        <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:20px_20px] opacity-35 pointer-events-none"></div>

        <!-- 桌面圖示清單 -->
        <div id="os-desktop-icons" class="relative z-10 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-4 w-full"></div>

        <!-- 執行中的應用程式視窗 -->
        <div id="os-app-window" class="absolute inset-3 z-30 bg-slate-900/95 border border-slate-700 rounded-2xl shadow-2xl flex flex-col hidden overflow-hidden backdrop-blur-xl">
          <div class="h-10 bg-slate-950 border-b border-slate-800 px-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="app-window-icon" class="text-base">📦</span>
              <span id="app-window-title" class="font-extrabold text-xs md:text-sm text-white">應用程式</span>
            </div>
            <button id="btn-close-app" class="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs">
              ✕ 關閉視窗
            </button>
          </div>
          <div id="app-window-body" class="flex-1 p-4 md:p-6 overflow-y-auto text-slate-200"></div>
        </div>
      </div>

      <!-- 底部工作列 -->
      <div class="h-10 bg-slate-950/95 border-t border-slate-800 px-4 flex items-center justify-between text-xs z-20">
        <div class="flex items-center gap-3">
          <button id="btn-os-start" class="px-3 py-1 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs flex items-center gap-1.5 shadow-sm">
            <span>🚀</span> 開始
          </button>
          <div class="h-4 w-px bg-slate-800"></div>
          <span class="text-slate-400 font-mono text-[11px] hidden sm:inline">工作站狀態：<span class="text-emerald-400">連線中 (Lab_WiFi_5G)</span></span>
        </div>
        <div class="flex items-center gap-4 font-mono text-slate-300 text-[11px]">
          <div>經費：<span id="os-taskbar-budget" class="text-emerald-400 font-bold">$35,000</span></div>
          <div id="os-taskbar-time" class="font-bold text-slate-200">2022/07/01 09:00</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 試車結算彈窗 -->
  <div id="result-modal" class="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden p-4 pointer-events-auto">
    <div class="max-w-md w-full bg-white rounded-3xl p-5 md:p-6 shadow-2xl border border-slate-200 text-center">
      <div id="res-icon" class="text-4xl md:text-5xl mb-2">🎉</div>
      <h2 id="res-title" class="text-lg md:text-xl font-black text-slate-900">整合試車報告</h2>
      <div id="res-badge" class="inline-block px-3 py-0.5 rounded-full text-[11px] font-mono-num font-bold mt-1 mb-2.5 bg-emerald-100 text-emerald-800 border border-emerald-300">STATUS</div>
      <p id="res-desc" class="text-xs text-slate-600 leading-relaxed text-left bg-slate-50 p-3.5 rounded-2xl border border-slate-100 mb-4"></p>
      <button id="btn-restart" class="w-full py-2.5 md:py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm transition">重置研發進度</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
